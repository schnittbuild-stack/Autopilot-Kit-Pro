name: AEF Protected Merge

on:
  workflow_run:
    workflows: ["AEF Release Gate"]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    environment: "aef-merge-gateway"
    steps:
      - name: Check out trusted protected branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
      - name: Check out immutable candidate for inspection
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: candidate
          fetch-depth: 1
      - name: Mint repository-confined App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.AEF_APP_ID }}
          private-key: ${{ secrets.AEF_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.workflow_run.repository.name }}
          permission-actions: read
          permission-checks: read
          permission-contents: write
          permission-issues: read
          permission-pull-requests: read
      - name: Merge exact eligible candidate
        env:
          AEF_MERGE_TOKEN: ${{ steps.app-token.outputs.token }}
          PULL_REQUEST: ${{ github.event.workflow_run.pull_requests[0].number }}
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: >-
          python3 scripts/aef_merge.py
          --repository "${{ github.repository }}"
          --pull-request "$PULL_REQUEST"
          --expected-head "$EXPECTED_HEAD"
          --candidate-root candidate
          --execute
