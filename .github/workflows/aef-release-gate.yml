name: AEF Release Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    name: AEF Release Gate / release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require final acceptance binding
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/aef_validate.py --base-ref "$BASE_SHA" --require-acceptance
      - name: Run governance tests
        run: python3 -m unittest discover -s tests -p 'test*.py'
